# Limpiador de USB - configuracion manual (version Linux / Omarchy)
#
# Este archivo SOLO PUEDE AGREGAR protecciones. Nunca quita las del
# NUCLEO: el disco de /, /boot, /home, /usr, /var o swap, el disco desde
# el que corre el programa, los discos internos y los que tengan un
# volumen cifrado o LVM abierto. Si lo borras o lo dejas invalido, el
# programa arranca igual de protegido.
#
# Se LEE, no se ejecuta: aqui no corre ningun comando.
#
# Vive en ~/.config/limpiador-usb/config.conf. Los botones PROTEGER /
# EXIMIR no escriben aqui, sino en ~/.config/limpiador-usb/preferencias,
# para no pisar estos comentarios.
#
# Formato:  clave = valor1, valor2, ...
# La serie de un disco se ve en su tarjeta, o con:
#   lsblk -d -o NAME,MODEL,SERIAL,SIZE,TRAN

# Modelos que se asumen disco de respaldo, ademas de los de fabrica
# (seagate, portable, expansion, backup plus, one touch, my passport,
# my book, elements, canvio, lacie). Se busca como texto dentro del modelo.
modelos =

# Etiquetas de volumen que bloquean su disco. Ejemplo: fotos boda, respaldo
etiquetas =

# Lista negra de numeros de serie. Gana siempre, incluso sobre "permitidos".
seriales =

# Series que quieres bloquear siempre. Es lo mismo que PROTEGER.
protegidos =

# Series de discos TUYOS exentos de las heuristicas (modelo, etiqueta y
# tamano). Es lo mismo que EXIMIR. Se comparan EXACTAS. No pueden saltarse
# el nucleo, ni la lista negra, ni una proteccion.
permitidos =

# Por encima de este tamano se asume disco de respaldo. Solo se acepta si
# es MENOR que el limite base de 2048 GB.
tam_max_gb = 2048
